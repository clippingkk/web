services:
  app:
    profiles: ['app']
    build:
      context: .
      args:
        GIT_COMMIT: local
    environment:
      APP_ORIGIN: http://localhost:3101
      CORS_ALLOWED_ORIGINS: http://localhost:3101
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/clippingkk
      DEBUG: 'true'
      JWT_SECRET: local-development-secret-change-me
      QUEUE_REDIS_URL: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/1
    ports:
      - '3101:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    # The image production runs: PostgreSQL 18 with PGroonga (docs/database.md).
    image: ghcr.io/rawback-app/db:18-3.6
    shm_size: 256m
    environment:
      POSTGRES_DB: clippingkk
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: postgres
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18. A new
      # volume, because PostgreSQL 18 cannot open the old 16 data directory.
      - clippingkk-postgres-18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d clippingkk']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - clippingkk-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clippingkk-postgres-18:
  clippingkk-redis:
