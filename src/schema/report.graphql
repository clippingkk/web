query fetchYearlyReport($year: Int!, $uid: Int!) {
  reportYearly(year: $year, uid: $uid) {
    user {
      id
      avatar
      name
      domain
      createdAt
      premiumEndAt
    }
    books {
      doubanId
      clippingsCount
      clippings {
        id
        content
        title
        pageAt
        createdAt
      }
    }
  }
}
