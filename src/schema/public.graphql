query publicData($limit: Int) {
  public(limit: $limit) {
    users {
      id
      avatar
      name
      domain
      premiumEndAt
    }
    books {
      doubanId
      clippingsCount
    }
    clippings {
      id
      content
      bookID
      title
      createdAt
      creator {
        id
        name
        avatar
        domain
      }
    }
  }
}
